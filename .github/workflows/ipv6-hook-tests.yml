name: IPv6 post-auth hook tests

on:
  push:
    paths:
      - 'mentohust/**'
      - 'tests/test-ipv6-hook.sh'
      - '.github/workflows/ipv6-hook-tests.yml'
  pull_request:
    paths:
      - 'mentohust/**'
      - 'tests/test-ipv6-hook.sh'
      - '.github/workflows/ipv6-hook-tests.yml'

jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell syntax
        run: |
          sh -n mentohust/files/mentohust-ipv6-up
          sh -n tests/test-ipv6-hook.sh
          sh -n mentohust/files/mentohust.init
      - name: Test DHCPv6 post-auth hook
        run: sh tests/test-ipv6-hook.sh
